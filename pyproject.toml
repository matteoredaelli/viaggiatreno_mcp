[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[project]
name = "pyviaggiatreno"
version = "0.1.0"
requires-python = ">=3.12"

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/viaggiatreno", "packages/viaggiatreno_mcp"]

[tool.uv.sources]
viaggiatreno = { workspace = true }

[dependency-groups]
dev = [
    "ruff",
    "pyright",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100

[tool.pyright]
pythonVersion = "3.14"

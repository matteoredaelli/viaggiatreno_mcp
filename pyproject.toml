[project]
name = "viaggiatreno_mcp"
version = "0.1.0"
description = "MCP for viaggiatreno APIs"
readme = "README.md"
authors = [
    { name = "Matteo Redaelli", email = "matteo.redaelli@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=4.0.10",
    "httpx>=0.28.1",
    "pydantic>=2.13.5",
]

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff",
    "pyright",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[project.scripts]
viaggiatreno-mcp = "viaggiatreno_mcp.server:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src", "."]

